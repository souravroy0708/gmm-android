name: Build GMM APK and Play Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.GMM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No GMM_KEYSTORE_BASE64 secret. Building with debug key."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GMM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        env:
          GMM_KEYSTORE_PASSWORD: ${{ secrets.GMM_KEYSTORE_PASSWORD }}
          GMM_KEY_ALIAS: ${{ secrets.GMM_KEY_ALIAS }}
          GMM_KEY_PASSWORD: ${{ secrets.GMM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/GMM-Organic-v1.0.${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/release/GMM-Organic-v1.0.${{ github.run_number }}.apk" app/build/outputs/apk/release/GMMOrganic.apk

      - name: Build signed release bundle (.aab) for Google Play
        if: env.GMM_KEYSTORE_PATH != ''
        env:
          GMM_KEYSTORE_PASSWORD: ${{ secrets.GMM_KEYSTORE_PASSWORD }}
          GMM_KEY_ALIAS: ${{ secrets.GMM_KEY_ALIAS }}
          GMM_KEY_PASSWORD: ${{ secrets.GMM_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/GMM-Organic-v1.0.${{ github.run_number }}.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GMM-Organic-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Play Store bundle (.aab) + mapping file
        if: env.GMM_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: GMM-Organic-PlayStore-v1.0.${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Warn when the bundle could not be built
        if: env.GMM_KEYSTORE_PATH == ''
        run: |
          echo "::warning::No signing secrets: the .aab for Google Play was NOT built. Add GMM_KEYSTORE_BASE64, GMM_KEYSTORE_PASSWORD, GMM_KEY_ALIAS, GMM_KEY_PASSWORD in Settings > Secrets > Actions."
